<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 학습</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, #f7f3ff 0%, #fbfaff 45%, #ffffff 100%);
    color: #171428;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 36px 18px 70px;
  }

  .hero {
    background: white;
    border: 1px solid #eadfff;
    border-radius: 28px;
    padding: 38px 34px;
    box-shadow: 0 20px 50px rgba(102, 51, 204, .08);
    margin-bottom: 26px;
    text-align: center;
  }

  .badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 999px;
    background: #ede4ff;
    color: #6b35d9;
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    font-size: 42px;
    line-height: 1.2;
    letter-spacing: -1.2px;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin: 24px 0;
  }

  .tab {
    border: 1px solid #e1d6f8;
    background: white;
    border-radius: 20px;
    padding: 20px 12px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
    color: #28213a;
  }

  .tab:hover {
    transform: translateY(-2px);
    border-color: #8b5cf6;
  }

  .tab.active {
    background: #6d3be8;
    color: white;
    border-color: #6d3be8;
    box-shadow: 0 14px 28px rgba(109, 59, 232, .2);
  }

  .panel {
    background: white;
    border: 1px solid #eadfff;
    border-radius: 28px;
    padding: 34px;
    box-shadow: 0 18px 45px rgba(70, 45, 120, .07);
  }

  .panel-title {
    color: #5d2ed1;
    font-size: 28px;
    margin: 0 0 24px;
  }

  article {
    line-height: 1.9;
    font-size: 16px;
  }

  article h2 {
    color: #5d2ed1;
  }

  article h3 {
    font-size: 24px;
    line-height: 1.5;
  }

  article p {
    margin-bottom: 18px;
    white-space: pre-line;
  }

  article a {
    color: #5d2ed1;
    font-weight: 800;
  }

  .archive-title {
    margin: 34px 0 14px;
    font-size: 22px;
    font-weight: 900;
  }

  .archive {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .archive button {
    width: 100%;
    text-align: left;
    background: white;
    border: 1px solid #eadfff;
    border-radius: 18px;
    padding: 18px 20px;
    cursor: pointer;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .archive button:hover {
    background: #f5efff;
  }

  .loading,
  .empty {
    background: white;
    border: 1px solid #eadfff;
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    color: #6f6682;
    font-weight: 700;
  }

  @media(max-width: 700px) {
    h1 { font-size: 32px; }
    .tabs { grid-template-columns: 1fr; }
    .panel { padding: 24px; }
  }
</style>
</head>

<body>
<div class="wrap">

  <section class="hero">
    <div class="badge">Daily Labor Law Learning</div>
    <h1 id="mainTitle">오늘의 노무 학습</h1>
  </section>

  <div id="loading" class="loading">데이터를 불러오고 있습니다...</div>

  <main id="app" style="display:none;">
    <div class="tabs">
      <button class="tab active" id="tab-issue" onclick="selectTab('issue')">이슈 공부하기</button>
      <button class="tab" id="tab-case" onclick="selectTab('case')">판례 공부하기</button>
      <button class="tab" id="tab-study" onclick="selectTab('study')">노동법 공부하기</button>
    </div>

    <section class="panel">
      <h2 class="panel-title" id="sectionTitle">오늘의 노무 이슈</h2>
      <div id="content"></div>
    </section>

    <h3 class="archive-title">지난 학습 목록</h3>
    <div class="archive" id="archive"></div>
  </main>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzhcIQHjTp4E54VKKKCeJ5676RcyZ7O_SsRkzLqESQM8loWnTokUNFHTVN8Y6a-9AjkzQ/exec";

let letters = [];
let currentDay = null;
let currentTab = "issue";

function formatDate(v) {
  if (!v) return "날짜 없음";

  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v)) {
    const [y, m, d] = v.substring(0, 10).split("-");
    return `${Number(y)}년 ${Number(m)}월 ${Number(d)}일`;
  }

  const dt = new Date(v);
  if (isNaN(dt)) return "날짜 없음";

  return `${dt.getFullYear()}년 ${dt.getMonth() + 1}월 ${dt.getDate()}일`;
}

function label(tab) {
  if (tab === "issue") return "오늘의 노무 이슈";
  if (tab === "case") return "오늘의 판례";
  return "오늘의 노동법 공부";
}

function normalizeResponse(json) {
  if (json.letters) return json.letters;

  if (json.data) {
    const grouped = {};

    json.data.forEach(item => {
      const d = item.publish_date || item.published_at || item.date || "";
      const date = String(d).substring(0, 10);
      const section = item.section || item.type;

      if (!grouped[date]) {
        grouped[date] = {
          publish_date: date,
          issue: null,
          case: null,
          study: null
        };
      }

      grouped[date][section] = {
        title: item.title,
        body_html: item.body_html || item.content || "",
        source_url: item.source_url || item.url || ""
      };
    });

    return Object.values(grouped)
      .sort((a, b) => String(b.publish_date).localeCompare(String(a.publish_date)));
  }

  return [];
}

async function init() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const json = await res.json();

    letters = normalizeResponse(json);

    if (!letters.length) throw new Error("empty data");

    currentDay = letters[0];

    document.getElementById("mainTitle").textContent =
      `${formatDate(currentDay.publish_date)} 오늘의 학습`;

    render();
    renderArchive();

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";
  } catch (e) {
    document.getElementById("loading").innerHTML =
      "데이터를 불러올 수 없습니다.<br>Apps Script 배포 권한이 '모든 사용자'인지 확인해주세요.";
    console.error(e);
  }
}

function selectTab(tab) {
  currentTab = tab;

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");

  render();
}

function render() {
  document.getElementById("sectionTitle").textContent = label(currentTab);

  const item = currentDay && currentDay[currentTab];

  if (!item) {
    document.getElementById("content").innerHTML =
      `<div class="empty">아직 발행된 내용이 없습니다.</div>`;
    return;
  }

  function cleanHtml(html) {
  if (!html) return "";

  // 1. a 태그 제거 (텍스트만 남김)
  let cleaned = html.replace(/<a[^>]*>(.*?)<\/a>/gi, "$1");

  // 2. font 태그 제거
  cleaned = cleaned.replace(/<font[^>]*>/gi, "").replace(/<\/font>/gi, "");

  // 3. 긴 URL 제거
  cleaned = cleaned.replace(/https?:\/\/[^\s<]+/g, "");

  return cleaned;
}

function render() {
  document.getElementById("sectionTitle").textContent = label(currentTab);

  const item = currentDay && currentDay[currentTab];

  if (!item) {
    document.getElementById("content").innerHTML =
      `<div class="empty">아직 발행된 내용이 없습니다.</div>`;
    return;
  }

  const cleanedHtml = cleanHtml(item.body_html);

  // CTA 버튼 (원문보기)
  const cta = item.source_url
    ? `<div style="margin-top:28px;">
         <a href="${item.source_url}" target="_blank"
            style="
              display:inline-block;
              padding:14px 22px;
              border-radius:12px;
              background:#6d3be8;
              color:white;
              font-weight:800;
              text-decoration:none;
              box-shadow:0 8px 18px rgba(109,59,232,.25);
            ">
            원문보기 →
         </a>
       </div>`
    : "";

  document.getElementById("content").innerHTML =
    `<article>
      <h3>${item.title || ""}</h3>
      ${cleanedHtml}
      ${cta}
    </article>`;
}

function renderArchive() {
  const box = document.getElementById("archive");
  box.innerHTML = "";

  letters.forEach((day) => {
    const btn = document.createElement("button");

    btn.innerHTML = `
      <span>${formatDate(day.publish_date)}</span>
      <span>보기 →</span>
    `;

    btn.onclick = () => {
      currentDay = day;
      currentTab = "issue";

      document.getElementById("mainTitle").textContent =
        `${formatDate(day.publish_date)} 오늘의 학습`;

      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.getElementById("tab-issue").classList.add("active");

      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    box.appendChild(btn);
  });
}

init();
</script>
</body>
</html>
