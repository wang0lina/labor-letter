<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily HR Report</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: linear-gradient(180deg, #f7f3ff 0%, #fbfaff 45%, #ffffff 100%);
  color: #171428;
}

.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding: 36px 18px 70px;
}

.hero {
  background: white;
  border: 1px solid #eadfff;
  border-radius: 28px;
  padding: 38px 34px;
  box-shadow: 0 20px 50px rgba(102, 51, 204, .08);
  margin-bottom: 26px;
  text-align: center;
}

.badge {
  display: inline-block;
  padding: 8px 16px;
  border-radius: 999px;
  background: #ede4ff;
  color: #6b35d9;
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: 42px;
  line-height: 1.2;
  letter-spacing: -1.2px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin: 24px 0;
}

.tab {
  border: 1px solid #e1d6f8;
  background: white;
  border-radius: 20px;
  padding: 20px 12px;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
  color: #28213a;
}

.tab:hover {
  transform: translateY(-2px);
  border-color: #8b5cf6;
}

.tab.active {
  background: #6d3be8;
  color: white;
  border-color: #6d3be8;
  box-shadow: 0 14px 28px rgba(109, 59, 232, .2);
}

.panel {
  background: white;
  border: 1px solid #eadfff;
  border-radius: 28px;
  padding: 34px;
  box-shadow: 0 18px 45px rgba(70, 45, 120, .07);
}

.panel-title {
  color: #5d2ed1;
  font-size: 28px;
  margin: 0 0 28px;
}

.content-card {
  border: 1px solid #e4e0ec;
  border-radius: 18px;
  padding: 30px;
  background: white;
}

.content-card h3 {
  font-size: 24px;
  line-height: 1.5;
  margin: 0 0 26px;
  color: #171428;
}

.content-card p {
  font-size: 17px;
  line-height: 1.95;
  margin: 0 0 24px;
  color: #171428;
  font-weight: 400;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.section-heading {
  display: block;
  font-size: 18px;
  font-weight: 900;
  color: #171428;
  margin: 28px 0 10px;
}

.cta {
  display: inline-block;
  margin-top: 26px;
  padding: 13px 20px;
  border-radius: 14px;
  background: #6d3be8;
  color: white !important;
  text-decoration: none;
  font-weight: 900;
  box-shadow: 0 12px 24px rgba(109, 59, 232, .22);
}

.keyword-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 8px;
}

.keyword-chip {
  display: inline-block;
  padding: 9px 14px;
  border-radius: 999px;
  background: #f0e7ff;
  color: #5d2ed1;
  text-decoration: none;
  font-weight: 800;
  font-size: 14px;
}

.keyword-chip:hover {
  background: #6d3be8;
  color: white;
}

.archive-title {
  margin: 34px 0 14px;
  font-size: 22px;
  font-weight: 900;
}

.archive {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.archive button {
  width: 100%;
  text-align: left;
  background: white;
  border: 1px solid #eadfff;
  border-radius: 18px;
  padding: 18px 20px;
  cursor: pointer;
  font-weight: 800;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.archive button:hover {
  background: #f5efff;
}

.loading,
.empty {
  background: white;
  border: 1px solid #eadfff;
  border-radius: 24px;
  padding: 40px;
  text-align: center;
  color: #6f6682;
  font-weight: 700;
}

@media(max-width: 700px) {
  h1 { font-size: 32px; }
  .tabs { grid-template-columns: 1fr; }
  .panel { padding: 24px; }
  .content-card { padding: 22px; }
}
</style>
</head>

<body>
<div class="wrap">
  <section class="hero">
    <div class="badge">Daily Labor Law Learning</div>
    <h1 id="mainTitle">오늘의 노무 학습</h1>
  </section>

  <div id="loading" class="loading">데이터를 불러오고 있습니다...</div>

  <main id="app" style="display:none;">
    <div class="tabs">
      <button class="tab active" id="tab-issue" onclick="selectTab('issue')">이슈 공부하기</button>
      <button class="tab" id="tab-case" onclick="selectTab('case')">판례 공부하기</button>
      <button class="tab" id="tab-study" onclick="selectTab('study')">노동법 공부하기</button>
    </div>

    <section class="panel">
      <h2 class="panel-title" id="sectionTitle">오늘의 노무 이슈</h2>
      <div id="content"></div>
    </section>

    <h3 class="archive-title">지난 학습 목록</h3>
    <div class="archive" id="archive"></div>
  </main>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzhcIQHjTp4E54VKKKCeJ5676RcyZ7O_SsRkzLqESQM8loWnTokUNFHTVN8Y6a-9AjkzQ/exec";

let letters = [];
let currentDay = null;
let currentTab = "issue";

const HEADINGS = [
  "■ 전체 요약",
  "■ 결론",
  "■ 키워드 추출",
  "1. 전체 요약",
  "2. 사건 개요",
  "2. 사실관계",
  "2. 왜 중요한가",
  "3. 자세히 살펴볼 부분",
  "3. 자세히 살펴볼 문제",
  "3. 핵심 쟁점",
  "3. 언제 사용되는가",
  "4. HR/노무 관점에서의 의미",
  "4. 법원의 판단을 실무적으로 읽는 법",
  "4. 사례로 이해하기",
  "5. 실무 체크포인트",
  "5. HR 실무 시사점",
  "5. HR 담당자가 특히 봐야 할 부분",
  "6. 결론",
  "6. 실무 체크리스트",
  "7. 결론",
  "7. 자주 헷갈리는 포인트",
  "8. 한 줄 정리"
];

function formatDate(v) {
  if (!v) return "날짜 없음";
  const str = String(v).substring(0, 10);
  const parts = str.split("-");
  if (parts.length === 3) {
    return Number(parts[0]) + "년 " + Number(parts[1]) + "월 " + Number(parts[2]) + "일";
  }
  return str;
}

function label(tab) {
  if (tab === "issue") return "오늘의 노무 이슈";
  if (tab === "case") return "오늘의 판례";
  return "오늘의 노동법 공부";
}

function decodeHtml(text) {
  const box = document.createElement("textarea");
  box.innerHTML = text || "";
  return box.value;
}

function escapeHtml(text) {
  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function normalizeResponse(json) {
  if (json && Array.isArray(json.letters)) return json.letters;
  return [];
}

function removeLongUrls(text) {
  return String(text || "")
    .replace(/https?:\/\/\S+/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function getSourceUrl(item) {
  if (!item) return "";
  if (item.source_url) return item.source_url;

  const decoded = decodeHtml(item.body_html || "");
  const temp = document.createElement("div");
  temp.innerHTML = decoded;
  const a = temp.querySelector("a");
  return a ? a.href : "";
}

// ✅ 수정: titleToExclude 파라미터 추가
function extractTextFromHtml(html, titleToExclude) {
  const decoded = decodeHtml(html || "");
  const temp = document.createElement("div");
  temp.innerHTML = decoded;

  temp.querySelectorAll("a").forEach(function(a) {
    a.replaceWith(a.textContent || "");
  });

  temp.querySelectorAll("font").forEach(function(f) {
    f.replaceWith(f.textContent || "");
  });

  temp.querySelectorAll("h1, h2, h3").forEach(function(el) {
    const t = (el.textContent || "").trim();
    if (
      t === "오늘의 노무 이슈" ||
      t === "오늘의 판례" ||
      t === "오늘의 노동법 공부"
    ) {
      el.remove();
    }
  });

  const pieces = [];
  const normalizedTitle = (titleToExclude || "").trim();

  temp.querySelectorAll("p, h3").forEach(function(el) {
    let text = (el.textContent || "").trim();

    if (!text) return;
    if (text === "원문 보기" || text === "원문보기" || text.indexOf("원문:") === 0) return;
    if (text === "오늘의 노무 이슈" || text === "오늘의 판례" || text === "오늘의 노동법 공부") return;

    // ✅ 수정: 제목과 동일한 텍스트면 본문에서 제외
    if (normalizedTitle && text === normalizedTitle) return;

    text = removeLongUrls(text);
    if (text) pieces.push(text);
  });

  return pieces.join("\n\n");
}

function splitContent(text) {
  const found = [];

  HEADINGS.forEach(function(h) {
    const idx = text.indexOf(h);
    if (idx >= 0) found.push({ heading: h, index: idx });
  });

  found.sort(function(a, b) {
    return a.index - b.index;
  });

  if (!found.length) {
    return [{ heading: "", body: text.trim() }];
  }

  const blocks = [];

  if (found[0].index > 0) {
    const before = text.substring(0, found[0].index).trim();
    if (before) blocks.push({ heading: "", body: before });
  }

  for (let i = 0; i < found.length; i++) {
    const start = found[i].index + found[i].heading.length;
    const end = i + 1 < found.length ? found[i + 1].index : text.length;
    const body = text.substring(start, end).trim();

    blocks.push({
      heading: found[i].heading,
      body: body
    });
  }

  return blocks;
}

// ✅ 수정: item.title을 extractTextFromHtml에 전달
function renderBody(item) {
  const text = extractTextFromHtml(item.body_html || "", item.title || "");
  const blocks = splitContent(text);
  let html = "";

  blocks.forEach(function(block) {
    if (!block.heading && !block.body) return;

    if (block.heading) {
      html += "<p><span class='section-heading'>" + escapeHtml(block.heading) + "</span>";

      if (block.heading === "■ 키워드 추출" && block.body) {
        const keywords = block.body.split(",").map(function(k) {
          return k.trim();
        }).filter(Boolean);

        html += "<span class='keyword-wrap'>";

        keywords.forEach(function(k) {
          const link = "https://www.google.com/search?q=" + encodeURIComponent(k);
          html += "<a class='keyword-chip' href='" + link + "' target='_blank' rel='noopener noreferrer'>" + escapeHtml(k) + "</a>";
        });

        html += "</span>";
      } else if (block.body) {
        html += escapeHtml(block.body);
      }

      html += "</p>";
    } else {
      html += "<p>" + escapeHtml(block.body) + "</p>";
    }
  });

  return html;
}

async function init() {
  const loading = document.getElementById("loading");

  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const json = await res.json();

    letters = normalizeResponse(json);

    if (!letters.length) {
      loading.innerHTML = "발행된 데이터가 없습니다.";
      return;
    }

    currentDay = letters[0];

    document.getElementById("mainTitle").textContent =
      formatDate(currentDay.publish_date) + " 오늘의 학습";

    render();
    renderArchive();

    loading.style.display = "none";
    document.getElementById("app").style.display = "block";
  } catch (e) {
    loading.innerHTML = "데이터를 불러올 수 없습니다.<br>" + e.message;
    console.error(e);
  }
}

function selectTab(tab) {
  currentTab = tab;

  document.querySelectorAll(".tab").forEach(function(t) {
    t.classList.remove("active");
  });

  document.getElementById("tab-" + tab).classList.add("active");
  render();
}

function render() {
  document.getElementById("sectionTitle").textContent = label(currentTab);

  const item = currentDay && currentDay[currentTab];

  if (!item) {
    document.getElementById("content").innerHTML =
      '<div class="empty">아직 발행된 내용이 없습니다.</div>';
    return;
  }

  const url = getSourceUrl(item);
  const body = renderBody(item);

  const cta = url
    ? '<a class="cta" href="' + url + '" target="_blank" rel="noopener noreferrer">원문보기 →</a>'
    : "";

  document.getElementById("content").innerHTML =
    '<div class="content-card"><h3>' + escapeHtml(item.title || "") + '</h3>' + body + cta + '</div>';
}

function renderArchive() {
  const box = document.getElementById("archive");
  box.innerHTML = "";

  const pastLetters = letters.slice(1);

  if (pastLetters.length === 0) {
    box.innerHTML = '<div class="empty">아직 지난 학습 목록이 없습니다.</div>';
    return;
  }

  pastLetters.forEach(function(day) {
    const btn = document.createElement("button");

    btn.innerHTML =
      "<span>" + formatDate(day.publish_date) + "</span><span>보기 →</span>";

    btn.onclick = function() {
      currentDay = day;
      currentTab = "issue";

      document.getElementById("mainTitle").textContent =
        formatDate(day.publish_date) + " 오늘의 학습";

      document.querySelectorAll(".tab").forEach(function(t) {
        t.classList.remove("active");
      });

      document.getElementById("tab-issue").classList.add("active");

      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    box.appendChild(btn);
  });
}

init();
</script>
</body>
</html>
