<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 학습</title>

<style>
body {
  font-family: sans-serif;
  background:#f6f4ff;
  margin:0;
}

.wrap {
  max-width:900px;
  margin:0 auto;
  padding:30px;
}

h1 {
  text-align:center;
}

.tabs {
  display:flex;
  gap:10px;
  margin:20px 0;
}

.tab {
  flex:1;
  padding:14px;
  border-radius:10px;
  border:1px solid #ccc;
  cursor:pointer;
}

.tab.active {
  background:#6d3be8;
  color:#fff;
}

.card {
  background:#fff;
  padding:25px;
  border-radius:14px;
  margin-top:20px;
  line-height:1.8;
}

.section-title {
  font-weight:800;
  margin-top:20px;
  display:block;
}

.cta {
  display:inline-block;
  margin-top:20px;
  padding:10px 16px;
  background:#6d3be8;
  color:#fff;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>
<div class="wrap">

<h1 id="title">로딩중...</h1>

<div class="tabs">
  <button class="tab active" onclick="selectTab('issue')" id="tab-issue">이슈</button>
  <button class="tab" onclick="selectTab('case')" id="tab-case">판례</button>
  <button class="tab" onclick="selectTab('study')" id="tab-study">노동법</button>
</div>

<div class="card" id="content">불러오는 중...</div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzhcIQHjTp4E54VKKKCeJ5676RcyZ7O_SsRkzLqESQM8loWnTokUNFHTVN8Y6a-9AjkzQ/exec";

let data = [];
let currentTab = "issue";

function formatDate(d){
  if(!d) return "";
  const s = d.substring(0,10).split("-");
  return Number(s[0])+"년 "+Number(s[1])+"월 "+Number(s[2])+"일 오늘의 학습";
}

function clean(html){
  const div = document.createElement("div");
  div.innerHTML = html;

  // 🔥 제목 제거 (핵심)
  div.querySelectorAll("h1,h2,h3,p").forEach(el=>{
    const t = (el.textContent||"").trim();
    if(
      t==="오늘의 노무 이슈"||
      t==="오늘의 판례"||
      t==="오늘의 노동법 공부"
    ){
      el.remove();
    }
  });

  // 링크 제거
  div.querySelectorAll("a").forEach(a=>{
    a.replaceWith(a.textContent);
  });

  // 원문 제거
  div.querySelectorAll("p").forEach(p=>{
    const t = (p.textContent||"").trim();
    if(t.includes("원문")) p.remove();
  });

  // 🔥 번호 구조 처리
  div.querySelectorAll("p").forEach(p=>{
    let t = p.textContent.trim();

    const match = t.match(/^(\d+\.\s[^\.]+)(.*)$/);

    if(match){
      const title = match[1];
      const body = match[2].trim();

      p.innerHTML =
        "<span class='section-title'>"+title+"</span><br>"+body;
    }
  });

  return div.innerHTML;
}

async function init(){
  const res = await fetch(API+"?t="+Date.now());
  const json = await res.json();

  data = json.letters || [];

  if(!data.length){
    document.getElementById("content").innerText="데이터 없음";
    return;
  }

  document.getElementById("title").innerText =
    formatDate(data[0].publish_date);

  render();
}

function selectTab(tab){
  currentTab = tab;

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");

  render();
}

function render(){
  const item = data[0][currentTab];

  if(!item){
    document.getElementById("content").innerText="내용 없음";
    return;
  }

  const body = clean(item.body_html);

  const url = item.source_url || "";

  document.getElementById("content").innerHTML =
    body + (url ? `<a class="cta" href="${url}" target="_blank">원문보기 →</a>` : "");
}

init();
</script>
</body>
</html>
