<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦕</text></svg>">
<title>Daily HR Report</title>

<style>
body {
  font-family: sans-serif;
  background: #faf7ff;
  margin: 0;
}

.wrap {
  max-width: 900px;
  margin: auto;
  padding: 30px;
}

.hero {
  text-align: center;
  margin-bottom: 20px;
}

.badge {
  background: #eee0ff;
  padding: 6px 14px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 10px;
  font-weight: bold;
}

.today-btn {
  display: none;
  margin: 8px auto 0;
  padding: 9px 14px;
  border: 1px solid #6d3be8;
  border-radius: 999px;
  background: white;
  color: #6d3be8;
  font-weight: 800;
  cursor: pointer;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.tab {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  background: white;
  cursor: pointer;
  font-weight: 700;
}

.tab.active {
  background: #6d3be8;
  color: white;
}

.issue-card,
.basic-card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 15px;
}

.issue-title {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
  line-height: 1.5;
}

.meta {
  margin-bottom: 10px;
  color: #555;
  font-size: 14px;
}

.section-heading {
  display: block;
  margin: 22px 0 8px;
  font-size: 17px;
  font-weight: 900;
  color: #171428;
}

.content-text {
  white-space: pre-line;
  line-height: 1.85;
  color: #222;
}

.keyword-chip {
  display: inline-block;
  padding: 6px 10px;
  margin: 4px;
  border-radius: 20px;
  background: #eee0ff;
  text-decoration: none;
  color: #5d2ed1;
  font-size: 13px;
  font-weight: 700;
}

.cta {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 16px;
  background: #6d3be8;
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 800;
}

  /* ===== 판례 가독성 개선 ===== */

.case-block {
  margin: 14px 0;
  padding: 16px;
  border-radius: 12px;
  background: #fbf8ff;
  border: 1px solid #eee2ff;
}

.case-block-title {
  font-weight: 900;
  color: #5d2ed1;
  margin-bottom: 8px;
}

.case-block-body {
  white-space: pre-line;
  line-height: 1.8;
  color: #222;
}
  
.archive-title {
  margin: 34px 0 14px;
  font-size: 22px;
  font-weight: 900;
}

.archive {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.archive button {
  width: 100%;
  text-align: left;
  background: white;
  border: 1px solid #eadfff;
  border-radius: 18px;
  padding: 18px 20px;
  cursor: pointer;
  font-weight: 800;
  display: flex;
  justify-content: space-between;
}

.archive button:hover {
  background: #f5efff;
}

#loading {
  background: white;
  border-radius: 14px;
  padding: 24px;
  text-align: center;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="hero">
    <div class="badge">Daily Labor Law Learning</div>
    <h1 id="title">오늘의 노무 학습</h1>
    <button id="todayBtn" class="today-btn" onclick="goToday()">오늘 학습으로 돌아가기</button>
  </div>

  <div id="loading">데이터 불러오는 중...</div>

  <div id="app" style="display:none;">
    <div class="tabs">
      <button class="tab active" onclick="selectTab(event, 'issue')">이슈</button>
      <button class="tab" onclick="selectTab(event, 'case')">판례</button>
      <button class="tab" onclick="selectTab(event, 'study')">노동법</button>
    </div>

    <div id="content"></div>

    <h3 class="archive-title">지난 학습 목록</h3>
    <div id="archive" class="archive"></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzhcIQHjTp4E54VKKKCeJ5676RcyZ7O_SsRkzLqESQM8loWnTokUNFHTVN8Y6a-9AjkzQ/exec";

let data = [];
let currentDay = null;
let currentTab = "issue";

function formatDate(date) {
  if (!date) return "";
  if (date.includes("-")) {
    const p = date.split("-");
    return Number(p[0]) + "년 " + Number(p[1]) + "월 " + Number(p[2]) + "일";
  }
  return date;
}

function escapeHtml(text) {
  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function decodeHtml(text) {
  const box = document.createElement("textarea");
  box.innerHTML = text || "";
  return box.value;
}

function stripHtml(html) {
  const div = document.createElement("div");
  div.innerHTML = decodeHtml(html || "");
  return (div.textContent || div.innerText || "").trim();
}

function renderKeywords(text) {
  const keywords = String(text || "")
    .split(",")
    .map(k => k.trim())
    .filter(Boolean);

  return keywords.map(k => `
    <a class="keyword-chip" href="https://www.google.com/search?q=${encodeURIComponent(k)}" target="_blank">
      ${escapeHtml(k)}
    </a>
  `).join("");
}

/* ---------------- 이슈 ---------------- */

function parseIssues(text) {
  const items = [];
  const clean = stripHtml(text).replace("■ 오늘의 노무 이슈 3가지", "").trim();
  const blocks = clean.split(/뉴스\s+\d+/).filter(x => x.trim());

  blocks.forEach((block, i) => {
    const item = { index: i + 1, title: "", source: "", date: "", keywords: [], url: "" };

    block.split("\n").forEach(line => {
      line = line.trim();
      if (line.startsWith("제목:")) item.title = line.replace("제목:", "").trim();
      if (line.startsWith("출처:")) item.source = line.replace("출처:", "").trim();
      if (line.startsWith("발행일:")) item.date = line.replace("발행일:", "").trim();
      if (line.startsWith("키워드:")) item.keywords = line.replace("키워드:", "").split(",").map(x => x.trim()).filter(Boolean);
      if (line.startsWith("URL:")) item.url = line.replace("URL:", "").trim();
    });

    if (item.title) items.push(item);
  });

  return items;
}

function renderIssues(text) {
  const issues = parseIssues(text);
  if (!issues.length) return "<div class='basic-card'>오늘의 이슈를 불러올 수 없습니다.</div>";

  return issues.map(item => `
    <div class="issue-card">
      <div class="issue-title">${escapeHtml(item.title)}</div>
      <div class="meta">출처: ${escapeHtml(item.source || "미상")} · ${escapeHtml(item.date || "미상")}</div>
      <div>${renderKeywords(item.keywords.join(","))}</div>
      ${item.url ? `<a class="cta" href="${escapeHtml(item.url)}" target="_blank">원문보기 →</a>` : ""}
    </div>
  `).join("");
}

/* ---------------- 판례/노동법 ---------------- */

function parseSections(text) {
  const clean = stripHtml(text);
  const headings = ["■ 판례 정보", "■ 판례 핵심 내용", "■ 키워드", "■ 전체 요약", "■ 결론"];
  const found = [];

  headings.forEach(h => {
    const idx = clean.indexOf(h);
    if (idx >= 0) found.push({ heading: h, index: idx });
  });

  found.sort((a, b) => a.index - b.index);

  if (!found.length) return [{ heading: "", body: clean }];

  const blocks = [];
  for (let i = 0; i < found.length; i++) {
    const start = found[i].index + found[i].heading.length;
    const end = i + 1 < found.length ? found[i + 1].index : clean.length;
    blocks.push({
      heading: found[i].heading,
      body: clean.substring(start, end).trim()
    });
  }

  return blocks;
}

  function formatCaseContent(text) {
  return String(text || "")
    .replace(/법원\/사건번호:/g, "\n\n법원/사건번호:")
    .replace(/판시사항:/g, "\n\n판시사항:")
    .replace(/판결요지:/g, "\n\n판결요지:")
    .replace(/주문:/g, "\n\n주문:")
    .replace(/판단이유:/g, "\n\n판단이유:")
    .replace(/참조조문:/g, "\n\n참조조문:")
    .replace(/\s*\[(\d+)\]/g, "\n[$1]")
    .trim();
}

function renderFormattedCaseText(text) {
  const formatted = formatCaseContent(text);
  const parts = formatted.split(/\n\n+/).filter(Boolean);

  return parts.map(part => {
    const match = part.match(/^(법원\/사건번호|판시사항|판결요지|주문|판단이유|참조조문):([\s\S]*)$/);

    if (match) {
      return `
        <div class="case-block">
          <div class="case-block-title">${escapeHtml(match[1])}</div>
          <div class="case-block-body">${escapeHtml(match[2].trim())}</div>
        </div>
      `;
    }

    return `<div class="case-block-body">${escapeHtml(part)}</div>`;
  }).join("");
}
  
function renderBasic(item) {
  if (!item) return "<div class='basic-card'>아직 내용이 없습니다.</div>";

  const blocks = parseSections(item.body_html || "");
  const url = item.source_url || "";

  let html = `<div class="basic-card"><div class="issue-title">${escapeHtml(item.title || "제목 없음")}</div>`;

  blocks.forEach(block => {
    if (!block.body) return;

    html += `<span class="section-heading">${escapeHtml(block.heading)}</span>`;

    if (block.heading === "■ 키워드") {
      html += `<div>${renderKeywords(block.body)}</div>`;
    } else if (currentTab === "case" && block.heading === "■ 판례 핵심 내용") {
      html += renderFormattedCaseText(block.body);
    } else {
      html += `<div class="content-text">${escapeHtml(block.body)}</div>`;
    }
  });

  if (url) html += `<a class="cta" href="${escapeHtml(url)}" target="_blank">원문보기 →</a>`;
  html += `</div>`;

  return html;
}

/* ---------------- API ---------------- */

async function init() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const json = await res.json();

    data = json.letters || [];

    if (!data.length) {
      document.getElementById("loading").innerText = "발행된 데이터가 없습니다.";
      return;
    }

    currentDay = data[0];
    updateTitle();
    render();
    renderArchive();

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";
  } catch (e) {
    document.getElementById("loading").innerText = "데이터를 불러올 수 없습니다.";
    console.error(e);
  }
}

/* ---------------- 탭/렌더 ---------------- */

function updateTitle() {
  document.getElementById("title").innerText =
    formatDate(currentDay.publish_date) + " 오늘의 학습";

  const todayBtn = document.getElementById("todayBtn");
  todayBtn.style.display = currentDay !== data[0] ? "inline-block" : "none";
}

function selectTab(event, tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

function setIssueTabActive() {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelector(".tab").classList.add("active");
}

function render() {
  if (!currentDay) return;

  if (currentTab === "issue") {
    document.getElementById("content").innerHTML =
      renderIssues(currentDay.issue && currentDay.issue.body_html);
  } else if (currentTab === "case") {
    document.getElementById("content").innerHTML = renderBasic(currentDay.case);
  } else {
    document.getElementById("content").innerHTML = renderBasic(currentDay.study);
  }
}

/* ---------------- 오늘/지난 목록 ---------------- */

function goToday() {
  currentDay = data[0];
  currentTab = "issue";
  updateTitle();
  setIssueTabActive();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderArchive() {
  const box = document.getElementById("archive");
  box.innerHTML = "";

  const pastLetters = data.slice(1);

  if (!pastLetters.length) {
    box.innerHTML = "<div class='basic-card'>아직 지난 학습 목록이 없습니다.</div>";
    return;
  }

  pastLetters.forEach(day => {
    const btn = document.createElement("button");
    btn.innerHTML = `<span>${formatDate(day.publish_date)}</span><span>보기 →</span>`;

    btn.onclick = function() {
      currentDay = day;
      currentTab = "issue";
      updateTitle();
      setIssueTabActive();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    box.appendChild(btn);
  });
}

init();
</script>
</body>
</html>
