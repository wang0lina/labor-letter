<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily HR Report</title>

<style>
body {
  font-family: sans-serif;
  background: #faf7ff;
  margin: 0;
}

.wrap {
  max-width: 900px;
  margin: auto;
  padding: 30px;
}

.hero {
  text-align: center;
  margin-bottom: 20px;
}

.badge {
  background: #eee0ff;
  padding: 6px 14px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 10px;
  font-weight: bold;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.tab {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  background: white;
  cursor: pointer;
}

.tab.active {
  background: #6d3be8;
  color: white;
}

.issue-card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 15px;
}

.issue-title {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.keyword-chip {
  display: inline-block;
  padding: 6px 10px;
  margin: 4px;
  border-radius: 20px;
  background: #eee0ff;
  text-decoration: none;
  color: #5d2ed1;
  font-size: 13px;
}

.cta {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 16px;
  background: #6d3be8;
  color: white;
  border-radius: 10px;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="hero">
    <div class="badge">Daily Labor Law Learning</div>
    <h1 id="title">오늘의 노무 학습</h1>
  </div>

  <div id="loading">데이터 불러오는 중...</div>

  <div id="app" style="display:none;">

    <div class="tabs">
      <button class="tab active" onclick="selectTab('issue')">이슈</button>
      <button class="tab" onclick="selectTab('case')">판례</button>
      <button class="tab" onclick="selectTab('study')">노동법</button>
    </div>

    <div id="content"></div>

  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzhcIQHjTp4E54VKKKCeJ5676RcyZ7O_SsRkzLqESQM8loWnTokUNFHTVN8Y6a-9AjkzQ/exec";

let data = [];
let currentTab = "issue";

/* ---------------- 핵심: 이슈 파싱 ---------------- */

function parseIssues(text) {
  const items = [];

  const blocks = text.split(/뉴스\s+\d+/).filter(x => x.trim());

  blocks.forEach((block, i) => {
    const item = {
      index: i + 1,
      title: "",
      source: "",
      date: "",
      keywords: [],
      url: ""
    };

    const lines = block.split("\n");

    lines.forEach(line => {
      line = line.trim();

      if (line.startsWith("제목:"))
        item.title = line.replace("제목:", "").trim();

      if (line.startsWith("출처:"))
        item.source = line.replace("출처:", "").trim();

      if (line.startsWith("발행일:"))
        item.date = line.replace("발행일:", "").trim();

      if (line.startsWith("키워드:"))
        item.keywords = line.replace("키워드:", "").split(",").map(x => x.trim());

      if (line.startsWith("URL:"))
        item.url = line.replace("URL:", "").trim();
    });

    if (item.title) items.push(item);
  });

  return items;
}

/* ---------------- 렌더 ---------------- */

function renderIssues(text) {
  const issues = parseIssues(text);

  if (!issues.length) return "데이터 없음";

  let html = "";

  issues.forEach(item => {
    html += `
      <div class="issue-card">
        <div class="issue-title">${item.title}</div>
        <div>출처: ${item.source} · ${item.date}</div>

        <div>
          ${item.keywords.map(k => `
            <a class="keyword-chip" href="https://www.google.com/search?q=${encodeURIComponent(k)}" target="_blank">
              ${k}
            </a>
          `).join("")}
        </div>

        <a class="cta" href="${item.url}" target="_blank">원문보기 →</a>
      </div>
    `;
  });

  return html;
}

/* ---------------- API ---------------- */

async function init() {
  const res = await fetch(API_URL);
  const json = await res.json();

  data = json.letters;

  document.getElementById("title").innerText =
    data[0].publish_date + " 오늘의 학습";

  render();

  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
}

/* ---------------- 탭 ---------------- */

function selectTab(tab) {
  currentTab = tab;

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");

  render();
}

function render() {
  const today = data[0];

  if (currentTab === "issue") {
    document.getElementById("content").innerHTML =
      renderIssues(today.issue.body_html);
  } else {
    document.getElementById("content").innerHTML = "준비중";
  }
}

init();

</script>
</body>
</html>
