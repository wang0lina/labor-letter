<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 노무 학습</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    body { font-family: "Pretendard Variable", Pretendard, sans-serif; }
    .loader { border-top-color: #7c3aed; animation: spinner 1.2s linear infinite; }
    @keyframes spinner { to { transform: rotate(360deg); } }
  </style>
</head>

<body class="bg-violet-50/40 text-slate-900 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">

    <header class="mb-8 text-center">
      <div class="inline-block px-4 py-1.5 bg-violet-100 text-violet-700 rounded-full text-sm font-semibold mb-4">
        Daily Labor Law Learning
      </div>
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-2">오늘의 노무 학습</h1>
      <p id="today-date-display" class="text-slate-500 font-medium"></p>
    </header>

    <div id="loading" class="flex flex-col items-center justify-center py-20">
      <div class="loader rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"></div>
      <p class="text-slate-500">오늘의 학습 내용을 불러오고 있습니다...</p>
    </div>

    <main id="main-content" class="hidden">
      <section class="bg-white rounded-3xl shadow-sm border border-violet-100 p-5 md:p-7 mb-8">
        <div class="grid grid-cols-3 gap-3 mb-6">
          <button onclick="selectTab('issue')" id="tab-issue" class="tab-btn rounded-2xl px-3 py-4 font-bold border transition">
            이슈 공부하기
          </button>
          <button onclick="selectTab('case')" id="tab-case" class="tab-btn rounded-2xl px-3 py-4 font-bold border transition">
            판례 공부하기
          </button>
          <button onclick="selectTab('study')" id="tab-study" class="tab-btn rounded-2xl px-3 py-4 font-bold border transition">
            노동법 공부하기
          </button>
        </div>

        <div id="content-box" class="prose max-w-none"></div>
      </section>

      <section class="mt-10">
        <h3 class="text-xl font-bold mb-4 text-slate-900">지난 학습 목록</h3>
        <div id="archive-list" class="space-y-3"></div>
      </section>
    </main>

    <footer class="mt-14 text-center text-xs text-slate-400">
      © AI Labor Law Learning Archive
    </footer>
  </div>

<script>
const BASE_URL = "https://script.google.com/macros/s/AKfycbzhcIQHjTp4E54VKKKCeJ5676RcyZ7O_SsRkzLqESQM8loWnTokUNFHTVN8Y6a-9AjkzQ/exec";

const loadingEl = document.getElementById("loading");
const mainContent = document.getElementById("main-content");
const todayDateDisplay = document.getElementById("today-date-display");
const contentBox = document.getElementById("content-box");
const archiveList = document.getElementById("archive-list");

let letters = [];
let currentDay = null;
let currentTab = "issue";

function formatKoreanDate(value) {
  if (!value) return "날짜 없음";

  if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
    const [y, m, d] = value.split("-");
    return `${Number(y)}년 ${Number(m)}월 ${Number(d)}일`;
  }

  const date = new Date(value);
  if (isNaN(date.getTime())) return "날짜 없음";

  return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
}

function tabLabel(tab) {
  if (tab === "issue") return "오늘의 노무 이슈";
  if (tab === "case") return "오늘의 판례";
  return "오늘의 노동법 공부";
}

function setActiveTab(tab) {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.className = "tab-btn rounded-2xl px-3 py-4 font-bold border transition bg-white text-slate-600 border-slate-200 hover:border-violet-300";
  });

  const active = document.getElementById("tab-" + tab);
  if (active) {
    active.className = "tab-btn rounded-2xl px-3 py-4 font-bold border transition bg-violet-600 text-white border-violet-600 shadow-md";
  }
}

function renderContent() {
  setActiveTab(currentTab);

  const item = currentDay ? currentDay[currentTab] : null;

  if (!item) {
    contentBox.innerHTML = `
      <div class="p-8 rounded-2xl bg-slate-50 border border-slate-100">
        <h2 class="text-2xl font-bold text-violet-700 mb-3">${tabLabel(currentTab)}</h2>
        <p class="text-slate-500">아직 발행된 내용이 없습니다.</p>
      </div>
    `;
    return;
  }

  contentBox.innerHTML = `
    <div class="mb-5">
      <span class="inline-flex px-3 py-1 rounded-full bg-violet-100 text-violet-700 text-sm font-bold">
        ${tabLabel(currentTab)}
      </span>
    </div>
    ${item.body_html}
  `;
}

function selectTab(tab) {
  currentTab = tab;
  renderContent();
}

function openDay(index) {
  currentDay = letters[index];
  currentTab = "issue";
  todayDateDisplay.textContent = `${formatKoreanDate(currentDay.publish_date)} 오늘의 레터입니다.`;
  renderContent();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderArchive() {
  archiveList.innerHTML = "";

  letters.forEach((day, index) => {
    const isLatest = index === 0;
    const div = document.createElement("div");
    div.className = "bg-white rounded-2xl border border-violet-100 shadow-sm overflow-hidden";

    div.innerHTML = `
      <button onclick="openDay(${index})" class="w-full px-5 py-4 flex items-center justify-between hover:bg-violet-50 transition">
        <div class="text-left">
          <p class="font-bold text-slate-800">${formatKoreanDate(day.publish_date)}</p>
          <p class="text-sm text-slate-400">${isLatest ? "현재 표시 중인 최신 레터" : "지난 레터 보기"}</p>
        </div>
        <span class="text-violet-500 font-bold">보기 →</span>
      </button>
    `;

    archiveList.appendChild(div);
  });
}

async function init() {
  try {
    const res = await fetch(BASE_URL);
    const json = await res.json();

    if (!json.success || !json.letters || json.letters.length === 0) {
      todayDateDisplay.textContent = "아직 발행된 레터가 없습니다.";
      loadingEl.classList.add("hidden");
      return;
    }

    letters = json.letters;
    currentDay = letters[0];

    todayDateDisplay.textContent = `${formatKoreanDate(currentDay.publish_date)} 오늘의 레터입니다.`;

    renderContent();
    renderArchive();

    loadingEl.classList.add("hidden");
    mainContent.classList.remove("hidden");
  } catch (e) {
    console.error(e);
    todayDateDisplay.textContent = "데이터를 불러올 수 없습니다.";
    loadingEl.classList.add("hidden");
  }
}

window.onload = init;
</script>
</body>
</html>
